name: Portal Link Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-portal-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate README contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Project Multiverse' README.md
          grep -q 'https://lokrajjoshi.github.io/multiverse-portal/' README.md
          grep -q 'https://github.com/Lokrajjoshi' README.md

      - name: Check live portal
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 20 \
            https://lokrajjoshi.github.io/multiverse-portal/ \
            > /tmp/multiverse.html
          grep -qi 'multiverse\|lokraj\|signal' /tmp/multiverse.html
